[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gerrit-fuzzer"
version = "1.0.0"
description = "Gerrit diff-based fuzzing harness generator using ARM Metis analysis and LLVM LibFuzzer"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
metis = ["metis-ai"]
dev = ["pytest>=7.0", "pytest-mock"]

[project.scripts]
gerrit-fuzzer = "gerrit_fuzzer.main:cli"

[tool.setuptools.packages.find]
include = ["gerrit_fuzzer*"]
